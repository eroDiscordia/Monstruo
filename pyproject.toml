[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "monstruo"
version = "1.0.0-alpha.1"
description = "Native KDE desktop management application for Arch Linux and CachyOS."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"

authors = [
    { name = "Carlos Owens" },
    { name = "Carlos Owens", email = "carlos@example.com" }
]

classifiers = [
    "Development Status :: 4 - Alpha",
    "Programming Language :: Python",
]

dependencies = [
    "PySide6>=6.11.1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]